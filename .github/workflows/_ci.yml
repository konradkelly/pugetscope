# Reusable job graph (on: workflow_call) shared by ci.yml (push/PR, fast
# feedback) and deploy.yml (gates the EC2 deploy job — deploy `needs: ci`,
# so every job appended here in later phases becomes deploy-gating with no
# further edits to deploy.yml).
name: CI checks

on:
  workflow_call: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        service: [api, websocket, ingestion, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        service: [api, websocket, ingestion, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm test

  # frontend has no integration tier (see the testing plan) — just the 3
  # backend services, each against real Postgres/Redis service containers.
  # Ports are pinned to match what every service's test:integration npm
  # script already hardcodes for local dev (localhost:5433/6379, the same
  # host ports docker-compose.yml publishes) — that npm script is also what
  # this job runs, unmodified, so local and CI share one code path with no
  # env-var overrides to keep in sync.
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        service: [api, websocket, ingestion]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: pugetscope
          POSTGRES_PASSWORD: pugetscope
          POSTGRES_DB: pugetscope
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pugetscope"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run test:integration

  # Proves each Dockerfile actually builds (no push — ECR push stays
  # deploy.yml-only) before the much more expensive e2e job below runs.
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck]
    strategy:
      matrix:
        service: [api, websocket, ingestion, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pugetscope/${{ matrix.service }}:ci ./${{ matrix.service }}

  # Playwright against the real composed stack (ingestion deliberately
  # omitted — see e2e/README.md) rather than reusing build-images' output:
  # cross-job image transfer (docker save/load, or a registry round-trip)
  # adds real complexity for a portfolio-scale project that doesn't run CI
  # often enough for the rebuild cost to matter. build-images still gates
  # this job so a broken Dockerfile fails fast and cheap first.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [integration-test, build-images]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Bring up the app stack
        run: docker compose up -d --build postgres redis api websocket frontend

      - name: Wait for services to be healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/healthz >/dev/null \
              && curl -sf http://localhost:3001/healthz >/dev/null \
              && curl -sf http://localhost:8090/ >/dev/null; then
              echo "Stack is up."
              exit 0
            fi
            sleep 2
          done
          echo "Stack did not become healthy in time" >&2
          exit 1

      - working-directory: e2e
        run: npm ci
      - working-directory: e2e
        run: npx playwright install --with-deps chromium
      - working-directory: e2e
        run: npm run seed
      - working-directory: e2e
        run: npm test

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
