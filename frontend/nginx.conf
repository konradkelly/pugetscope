# Docker Compose's embedded DNS — only reachable/used there. In k3d/EC2 this
# whole location block is never hit (the Ingress routes /digest straight to
# the api Service, bypassing this pod entirely), so a Docker-specific
# resolver here is harmless.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Local-dev-only proxy: there's no Ingress in docker-compose, so this
    # nginx is the actual entry point for the digest's server-rendered HTML
    # page (api/src/routes/digest.ts). The SPA's own JSON fetch
    # (/digests/:date) never comes through here — it hits api directly via
    # VITE_API_URL — so only /digest/ (singular) needs a proxy.
    # `set` + variable (not a bare proxy_pass hostname) forces re-resolution
    # per the resolver's TTL instead of caching api's IP forever, so a
    # `docker compose restart api` doesn't leave this pointed at a stale IP.
    location /digest/ {
        set $api_upstream api:3000;
        proxy_pass http://$api_upstream;
        # nginx doesn't forward the original Host header by default — without
        # this, api/src/routes/digest.ts's request.headers.host (used for
        # og:url) sees "api:3000" instead of the real public host (caught by
        # curling through this proxy during verification).
        # $http_host (not $host) — nginx's $host strips the port, which
        # silently dropped :8090 from og:url on the first verification pass.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
