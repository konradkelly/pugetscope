apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket
  namespace: pugetscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: websocket
  template:
    metadata:
      labels:
        app: websocket
    spec:
      containers:
        - name: websocket
          image: pugetscope/websocket:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: REDIS_HOST
              valueFrom: { configMapKeyRef: { name: datastore-config, key: REDIS_HOST } }
            - name: REDIS_PORT
              valueFrom: { configMapKeyRef: { name: datastore-config, key: REDIS_PORT } }
            - name: REDIS_URL
              value: "redis://$(REDIS_HOST):$(REDIS_PORT)"
            - name: CORS_ORIGIN
              value: "http://pugetscope.127.0.0.1.nip.io:8081"
            # Push-alert matching (src/alerts/) reads alert_watches /
            # push_subscriptions — same Postgres wiring as api-deployment.yaml.
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_DB } }
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: datastore-config, key: POSTGRES_HOST } }
            - name: POSTGRES_PORT
              valueFrom: { configMapKeyRef: { name: datastore-config, key: POSTGRES_PORT } }
            - name: POSTGRES_SSL
              valueFrom: { configMapKeyRef: { name: datastore-config, key: POSTGRES_SSL } }
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            # Blank VAPID keys disable alert delivery rather than crashing —
            # see src/config.ts.
            - name: VAPID_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: push-credentials, key: VAPID_PUBLIC_KEY } }
            - name: VAPID_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: push-credentials, key: VAPID_PRIVATE_KEY } }
            - name: SES_FROM_EMAIL
              value: ""
          readinessProbe:
            httpGet: { path: /healthz, port: 3001 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: websocket
  namespace: pugetscope
spec:
  selector:
    app: websocket
  ports:
    - port: 3001
      targetPort: 3001
