apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pugetscope-api
  namespace: pugetscope
  annotations:
    # rewrite-target applies to every path rule on an Ingress resource, not
    # just one — kept in its own Ingress so it doesn't also rewrite /live
    # (see pugetscope-app below) via its empty capture group.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # Above the pg pool's statement_timeout (30s, see api/src/db/postgres.ts)
    # so a slow analytics query gets to return its own error response instead
    # of nginx's default 60s read timeout cutting it off with a bare 504 —
    # that default is exactly what surfaced the traffic/airports timeout.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "35"
spec:
  ingressClassName: nginx
  rules:
    - host: pugetscope.127.0.0.1.nip.io
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pugetscope-app
  namespace: pugetscope
  annotations:
    # /live is a long-lived websocket connection — default proxy timeouts
    # would kill it after 60s of no new HTTP traffic on the connection.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: pugetscope.127.0.0.1.nip.io
      http:
        paths:
          - path: /live
            pathType: Exact
            backend:
              service:
                name: websocket
                port:
                  number: 3001
          # Server-rendered digest/airport/neighborhood/traffic pages
          # (api/src/routes/digest.ts, airports.ts, analytics.ts,
          # traffic.ts) — crawlable HTML, deliberately not behind the
          # /api(/|$)(.*) rewrite rule above (pugetscope-api), since these
          # are first-class page URLs, not JSON API calls. The JSON APIs
          # live at the plural /api/digests, /api/airports,
          # /api/analytics/overflights, /api/analytics/traffic instead, so
          # there's no path collision. /digest also covers the bare
          # /digest archive index, not just /digest/:date.
          - path: /digest
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /airport
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /neighborhood
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /traffic
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pugetscope-analytics
  namespace: pugetscope
spec:
  ingressClassName: nginx
  rules:
    # Umami needs its own host (not a shared path) to run unprefixed at root —
    # nip.io resolves any subdomain to the embedded IP, so this needs no local
    # DNS setup. Patched to analytics.pugetscope.com in overlays/ec2.
    - host: analytics.pugetscope.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: umami
                port:
                  number: 3000
