apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: pugetscope
data:
  001_schema.sql: |
    CREATE EXTENSION IF NOT EXISTS postgis;

    -- One-off: adsbdb tier removed in favor of AeroDataBox FIDS coverage across
    -- all 5 regional airports (see docs/SPEC.md §12) — safe/idempotent to leave
    -- here permanently since this script is re-run against the live DB too.
    DROP TABLE IF EXISTS flight_routes;

    CREATE TABLE IF NOT EXISTS users (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      email TEXT UNIQUE NOT NULL,
      password_hash TEXT,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- Reference/enrichment data — batch-loaded from the OpenSky Aircraft Database.
    -- See docs/SPEC.md §7. first_seen/last_seen track sightings by the ingestion
    -- service; the rest is populated by ingestion/src/enrich.ts (npm run enrich).
    CREATE TABLE IF NOT EXISTS aircraft (
      icao24 TEXT PRIMARY KEY,
      registration TEXT,
      manufacturer TEXT,
      model TEXT,
      typecode TEXT,
      operator TEXT,
      first_seen TIMESTAMPTZ NOT NULL DEFAULT now(),
      last_seen TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS positions (
      id BIGSERIAL PRIMARY KEY,
      icao24 TEXT NOT NULL REFERENCES aircraft(icao24),
      callsign TEXT,
      position GEOGRAPHY(POINT, 4326) NOT NULL,
      altitude DOUBLE PRECISION,
      ground_speed DOUBLE PRECISION,
      heading DOUBLE PRECISION,
      vertical_speed DOUBLE PRECISION,
      recorded_at TIMESTAMPTZ NOT NULL
    );

    CREATE INDEX IF NOT EXISTS positions_icao24_recorded_at_idx
      ON positions (icao24, recorded_at);

    CREATE INDEX IF NOT EXISTS positions_position_gist_idx
      ON positions USING GIST (position);

    -- Region-wide traffic queries (analytics/traffic/region) filter on
    -- recorded_at alone, with no icao24 or spatial predicate to piggyback on.
    CREATE INDEX IF NOT EXISTS positions_recorded_at_idx
      ON positions (recorded_at);

    -- Pre-aggregated daily/hourly flight counts per airport (+ 'REGION' for
    -- the whole coverage area), maintained incrementally by ingestion
    -- (src/db/trafficRollup.ts) so api/src/routes/traffic.ts never has to
    -- COUNT(DISTINCT ...) over the full `positions` table per request — see
    -- docs/Region-wide-traffic-totals.md and the timeout incident it followed.
    CREATE TABLE IF NOT EXISTS traffic_daily_counts (
      scope TEXT NOT NULL CHECK (scope IN ('KSEA','KPAE','KBFI','KRNT','KTIW','REGION')),
      date DATE NOT NULL,
      flights INTEGER NOT NULL,
      PRIMARY KEY (scope, date)
    );

    -- Separate from traffic_daily_counts rather than derived from it: an
    -- aircraft seen across 2 hours legitimately contributes to both hours'
    -- counts but only once to the day's total, so summing hourly rows for a
    -- day can exceed that day's daily total (see docs/Region-wide-traffic-totals.md).
    CREATE TABLE IF NOT EXISTS traffic_hourly_counts (
      scope TEXT NOT NULL CHECK (scope IN ('KSEA','KPAE','KBFI','KRNT','KTIW','REGION')),
      date DATE NOT NULL,
      hour SMALLINT NOT NULL,
      flights INTEGER NOT NULL,
      PRIMARY KEY (scope, date, hour)
    );

    CREATE TABLE IF NOT EXISTS user_preferences (
      user_id UUID NOT NULL REFERENCES users(id),
      key TEXT NOT NULL,
      value TEXT,
      PRIMARY KEY (user_id, key)
    );

    -- Cached AeroDataBox FIDS board entries, keyed by callsign (see docs/SPEC.md
    -- §12 tier 1). Only rows with a non-null call_sign are stored — that's our
    -- sole join key against OpenSky's callsign, so a row without one is unusable.
    -- Each row describes one leg (this airport is either origin or destination);
    -- other_* fields describe the opposite end of that leg.
    CREATE TABLE IF NOT EXISTS fids_flights (
      airport_icao TEXT NOT NULL,
      direction TEXT NOT NULL CHECK (direction IN ('departure', 'arrival')),
      call_sign TEXT NOT NULL,
      flight_number TEXT,
      status TEXT,
      airline_name TEXT,
      other_icao TEXT,
      other_iata TEXT,
      other_name TEXT,
      other_lat DOUBLE PRECISION,
      other_lon DOUBLE PRECISION,
      scheduled_time TIMESTAMPTZ,
      revised_time TIMESTAMPTZ,
      fetched_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      PRIMARY KEY (airport_icao, direction, call_sign)
    );

    -- Tracks the last successful FIDS refresh per airport so a service
    -- restart/redeploy doesn't reset the refresh cadence and burn budget.
    CREATE TABLE IF NOT EXISTS fids_refresh_state (
      airport_icao TEXT PRIMARY KEY,
      last_fetched_at TIMESTAMPTZ NOT NULL
    );

    -- Zip code (ZCTA) boundary polygons, batch-loaded once from Census
    -- TIGERweb (ingestion/src/loadZips.ts, npm run load-zips) — a static
    -- reference dataset, not something that changes poll-to-poll. Backs
    -- noise/overflight-by-neighborhood analytics: a spatial join against
    -- `positions` answers "what flew over this zip, and when."
    CREATE TABLE IF NOT EXISTS zip_boundaries (
      zcta5 TEXT PRIMARY KEY,
      boundary GEOGRAPHY(MULTIPOLYGON, 4326) NOT NULL
    );

    CREATE INDEX IF NOT EXISTS zip_boundaries_boundary_gist_idx
      ON zip_boundaries USING GIST (boundary);

    -- Pre-aggregated hourly overflight counts per zip, restricted to the 6
    -- curated "noise-relevant" zips the frontend surfaces (see
    -- NeighborhoodAnalyticsPanel.tsx's ZIP_OPTIONS) — the same rollup pattern
    -- as traffic_hourly_counts above, adapted for a spatial (not per-airport-
    -- point) predicate. Maintained incrementally by ingestion
    -- (src/db/overflightRollup.ts) so api/src/routes/analytics.ts never has
    -- to ST_Intersects-join the full `positions` table per request. avg
    -- altitude isn't re-aggregable across rows the way SUM/MIN are, so
    -- altitude_sum + altitude_count are stored instead of a precomputed
    -- average; readers compute avg = altitude_sum / altitude_count.
    CREATE TABLE IF NOT EXISTS overflight_hourly_counts (
      zcta5 TEXT NOT NULL REFERENCES zip_boundaries(zcta5),
      date DATE NOT NULL,
      hour SMALLINT NOT NULL,
      overflights INTEGER NOT NULL,
      altitude_sum DOUBLE PRECISION NOT NULL DEFAULT 0,
      altitude_count INTEGER NOT NULL DEFAULT 0,
      min_altitude DOUBLE PRECISION,
      PRIMARY KEY (zcta5, date, hour)
    );

    -- Personal spotting log (auth-gated) — the payoff for accounts existing.
    -- Each row is a user "logging" a sighting, auto-confirmed server-side
    -- against a recent `positions` row (api/src/routes/spottings.ts) rather
    -- than trusting a bare client claim, so the log reads as a real logbook
    -- instead of a self-reported list.
    CREATE TABLE IF NOT EXISTS spottings (
      id BIGSERIAL PRIMARY KEY,
      user_id UUID NOT NULL REFERENCES users(id),
      icao24 TEXT NOT NULL REFERENCES aircraft(icao24),
      spotted_at TIMESTAMPTZ NOT NULL,
      latitude DOUBLE PRECISION,
      longitude DOUBLE PRECISION,
      altitude DOUBLE PRECISION,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS spottings_user_id_spotted_at_idx
      ON spottings (user_id, spotted_at DESC);

    CREATE INDEX IF NOT EXISTS spottings_user_id_icao24_idx
      ON spottings (user_id, icao24);

    -- Device-scoped push alerts. `device_id` is a UUID generated client-side and
    -- kept in localStorage; knowing it is the only "auth" a device has, the same
    -- trust model as a bearer token. Works with no account at all — `user_id`
    -- (below) is an optional account tag layered on top: when set, it's how a
    -- watch created on one device gets delivered to every other device the same
    -- account has push-enabled (see websocket/src/alerts/cache.ts). `SET NULL`
    -- rather than `CASCADE` on account deletion so a device's subscription/watches
    -- survive losing their account link — they just fall back to device-only.
    CREATE TABLE IF NOT EXISTS push_subscriptions (
      device_id UUID PRIMARY KEY,
      user_id UUID REFERENCES users(id) ON DELETE SET NULL,
      endpoint TEXT NOT NULL,
      p256dh TEXT NOT NULL,
      auth TEXT NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- Additive — table already exists in the live DB, CREATE TABLE IF NOT EXISTS
    -- above is a no-op there, so the new column needs its own idempotent statement.
    ALTER TABLE push_subscriptions ADD COLUMN IF NOT EXISTS user_id UUID REFERENCES users(id) ON DELETE SET NULL;

    CREATE INDEX IF NOT EXISTS push_subscriptions_user_id_idx
      ON push_subscriptions (user_id) WHERE user_id IS NOT NULL;

    -- One row per watch a device (or, once linked, an account) has created.
    -- `kind` picks which half of the columns below apply: 'geofence' uses
    -- location/radius_m/max_altitude_m, 'callsign' uses match_value (checked
    -- against the live callsign or icao24 — see websocket/src/alerts/matching.ts).
    -- `last_triggered_at` drives a per-watch cooldown so a loitering aircraft
    -- doesn't refire on every ~30s poll (same idea as spottings'
    -- DUPLICATE_COOLDOWN_MINUTES). `device_id` is always the device that created
    -- the watch; `user_id`, when set, is who owns it — see push_subscriptions
    -- above for why that's a nullable, optional tag rather than a replacement.
    CREATE TABLE IF NOT EXISTS alert_watches (
      id BIGSERIAL PRIMARY KEY,
      device_id UUID NOT NULL REFERENCES push_subscriptions(device_id) ON DELETE CASCADE,
      user_id UUID REFERENCES users(id) ON DELETE SET NULL,
      kind TEXT NOT NULL CHECK (kind IN ('geofence', 'callsign')),
      label TEXT,
      location GEOGRAPHY(POINT, 4326),
      radius_m INTEGER,
      max_altitude_m DOUBLE PRECISION,
      match_value TEXT,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      last_triggered_at TIMESTAMPTZ
    );

    -- Additive — same reasoning as push_subscriptions.user_id above.
    ALTER TABLE alert_watches ADD COLUMN IF NOT EXISTS user_id UUID REFERENCES users(id) ON DELETE SET NULL;

    CREATE INDEX IF NOT EXISTS alert_watches_device_id_idx
      ON alert_watches (device_id);

    CREATE INDEX IF NOT EXISTS alert_watches_user_id_idx
      ON alert_watches (user_id) WHERE user_id IS NOT NULL;

    CREATE INDEX IF NOT EXISTS alert_watches_location_gist_idx
      ON alert_watches USING GIST (location);

    -- AI daily digest — one row per calendar day (LA time), generated by a
    -- nightly one-off job (ingestion/src/generateDigest.ts) from the already-
    -- rolled-up traffic_daily_counts table (see docs/rollup-tables.md), not from
    -- positions directly. stats holds the structured numbers the LLM was given
    -- ({date, totalFlights, byAirport}), surfaced in the UI alongside the prose
    -- for transparency — same "show your confidence" ethos as route.confidence
    -- (docs/SPEC.md §12). Served two ways by api/src/routes/digest.ts: a real
    -- server-rendered HTML document at GET /digest/:date (crawlable — see that
    -- file for why a client-only SPA route isn't enough) and JSON at
    -- GET /digests/:date for the interactive panel.
    CREATE TABLE IF NOT EXISTS digests (
      date DATE PRIMARY KEY,
      headline TEXT NOT NULL,
      body TEXT NOT NULL,
      meta_description TEXT NOT NULL,
      stats JSONB NOT NULL DEFAULT '{}'::jsonb,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
